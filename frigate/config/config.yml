# Camera logins come from .env (FRIGATE_CAMnnn_USER / _PASS)
mqtt:
  host: mosquitto
  user: '{FRIGATE_MQTT_USER}'
  password: '{FRIGATE_MQTT_PASSWORD}'

# Login protection for public access via cam.saxli.app
auth:
  failed_login_rate_limit: 1/second;5/minute;20/hour
  trusted_proxies:
    - 172.18.0.1/32  # Docker gateway: cloudflared and other host traffic arrive from here
  cookie_secure: true

detectors:
  ov:
    type: openvino
    device: GPU  # Intel HD 620

model:
  width: 300
  height: 300
  input_tensor: nhwc
  input_pixel_format: bgr
  path: /openvino-model/ssdlite_mobilenet_v2.xml
  labelmap_path: /openvino-model/coco_91cl_bkgr.txt

ffmpeg:
  hwaccel_args: preset-vaapi
  output_args:
    record: preset-record-generic-audio-copy

go2rtc:
  streams:
    bedroom:
      - rtsp://{FRIGATE_CAM106_USER}:{FRIGATE_CAM106_PASS}@192.168.0.106:554/live/ch0
    wardrobe:
      - rtsp://{FRIGATE_CAM107_USER}:{FRIGATE_CAM107_PASS}@192.168.0.107:554/live/ch0
    living_room:
      - rtsp://{FRIGATE_CAM110_USER}:{FRIGATE_CAM110_PASS}@192.168.0.110:554/live/ch0
    kitchen:
      - rtsp://{FRIGATE_CAM111_USER}:{FRIGATE_CAM111_PASS}@192.168.0.111:554/live/ch0

# Motion recording around the clock; person clips kept longer
record:
  enabled: true
  continuous:
    days: 0
  motion:
    days: 30
  alerts:
    retain:
      days: 30
  detections:
    retain:
      days: 30

objects:
  track:
    - person

detect:
  width: 640
  height: 360
  fps: 5

  enabled: true
cameras:
  # One stream per camera (main, 2304x1296): the camera only allows a few
  # connections, and fewer leaves headroom after restarts. Detection runs on
  # a GPU-scaled 640x360 copy.

  # Motion recording 09:00-21:00 only (toggled by a Home Assistant automation), no object detection
  bedroom:
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/bedroom
          input_args: preset-rtsp-restream
          roles: [detect, record]
    onvif:  # pan/tilt controls in the Frigate live view
      host: 192.168.0.106
      port: 8899
      user: '{FRIGATE_CAM106_USER}'
      password: '{FRIGATE_CAM106_PASS}'
    detect:
      enabled: false

  wardrobe:
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/wardrobe
          input_args: preset-rtsp-restream
          roles: [detect, record]
    onvif:  # pan/tilt controls in the Frigate live view
      host: 192.168.0.107
      port: 8899
      user: '{FRIGATE_CAM107_USER}'
      password: '{FRIGATE_CAM107_PASS}'

  living_room:
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/living_room
          input_args: preset-rtsp-restream
          roles: [detect, record]
    onvif:  # pan/tilt controls in the Frigate live view
      host: 192.168.0.110
      port: 8899
      user: '{FRIGATE_CAM110_USER}'
      password: '{FRIGATE_CAM110_PASS}'

  kitchen:
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/kitchen
          input_args: preset-rtsp-restream
          roles: [detect, record]
    onvif:  # pan/tilt controls in the Frigate live view
      host: 192.168.0.111
      port: 8899
      user: '{FRIGATE_CAM111_USER}'
      password: '{FRIGATE_CAM111_PASS}'
version: 0.18-0
notifications:
  enabled: 'true'
camera_groups:
  test:
    order: 1
    icon: LuAirplay
    cameras:
      - bedroom
      - wardrobe
      - living_room
      - kitchen
